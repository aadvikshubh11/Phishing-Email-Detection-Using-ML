<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phishing Email Detector</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .container {
        width: 100%;
        max-width: 900px;
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.16);
        padding: 2.5rem;
      }
      .header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .header i {
        color: #667eea;
        font-size: 3rem;
      }
      h1 {
        margin: 1rem 0 0.25rem;
        font-size: 2.6rem;
        color: #1f2937;
      }
      .subtitle {
        color: #4b5563;
        font-size: 1.05rem;
        margin: 0;
      }
      .message {
        border-radius: 14px;
        padding: 1.2rem 1.4rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 1rem;
      }
      .message.error {
        background: #fef2f2;
        color: #991b1b;
        border-left: 4px solid #dc2626;
      }
      .message.success {
        background: #ecfdf5;
        color: #166534;
        border-left: 4px solid #16a34a;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-label {
        display: block;
        margin-bottom: 0.75rem;
        font-weight: 700;
        color: #334155;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        padding: 1rem;
        border-radius: 16px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
        line-height: 1.6;
        resize: vertical;
      }
      textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
      }
      .button-group {
        text-align: right;
      }
      button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        padding: 1rem 1.8rem;
        border-radius: 14px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px rgba(102, 126, 234, 0.35);
      }
      button:disabled {
        opacity: 0.75;
        cursor: not-allowed;
      }
      .result-card {
        display: none;
        margin-top: 1.5rem;
      }
      .result-card.active {
        display: block;
      }
      .result-card .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .result-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #1f2937;
      }
      .confidence-badge {
        padding: 0.65rem 0.9rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        color: #ffffff;
        font-weight: 700;
      }
      .confidence-bar {
        width: 100%;
        height: 12px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 1rem;
      }
      .confidence-fill {
        height: 100%;
        background: linear-gradient(90deg, #84cc16, #facc15, #f97316);
        transition: width 0.4s ease;
      }
      .explanation {
        margin-top: 2rem;
        padding: 1.6rem;
        background: #f8fafc;
        border-radius: 18px;
        border: 1px solid #e2e8f0;
      }
      .explanation h2 {
        margin: 0 0 1.25rem;
        font-size: 1.3rem;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }
      .features-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.5rem;
      }
      .feature-block {
        background: #ffffff;
        border-radius: 16px;
        padding: 1.25rem;
        border: 1px solid #e2e8f0;
      }
      .feature-block h3 {
        margin: 0 0 1rem;
        font-size: 1rem;
        color: #334155;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .feature-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .feature-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.7rem 0;
        border-bottom: 1px solid #f1f5f9;
      }
      .feature-list li:last-child {
        border-bottom: none;
      }
      .feature-name {
        font-weight: 600;
        color: #475569;
      }
      .feature-score {
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
      .positive-score { background: #fee2e2; color: #991b1b; }
      .negative-score { background: #dcfce7; color: #166534; }
      .hidden { display: none; }
      @media (max-width: 760px) {
        .features-grid { grid-template-columns: 1fr; }
        .header i { font-size: 2.5rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <i class="fas fa-shield-alt"></i>
        <h1>Phishing Email Detector</h1>
        <p class="subtitle">Analyze email content instantly with a lightweight AI backend.</p>
      </div>

      <div id="alert" class="message hidden"></div>

      <form id="emailForm">
        <div class="form-group">
          <label class="form-label" for="email_text"><i class="fas fa-envelope"></i> Email Content</label>
          <textarea id="email_text" name="email_text" placeholder="Paste the full email content here..." required></textarea>
        </div>
        <div class="button-group">
          <button type="submit" id="analyzeBtn"><i class="fas fa-search"></i> Analyze Email</button>
        </div>
      </form>

      <div id="resultCard" class="result-card">
        <div class="header">
          <div>
            <div class="result-title">Prediction</div>
            <div id="resultLabel"></div>
          </div>
          <div id="confidenceBadge" class="confidence-badge"></div>
        </div>
        <div class="confidence-bar"><div id="confidenceFill" class="confidence-fill"></div></div>
      </div>

      <div id="explanation" class="explanation hidden">
        <h2><i class="fas fa-chart-bar"></i> Analysis breakdown</h2>
        <div class="features-grid">
          <div class="feature-block">
            <h3><i class="fas fa-exclamation-triangle"></i> Phishing indicators</h3>
            <ul id="positiveList" class="feature-list"></ul>
          </div>
          <div class="feature-block">
            <h3><i class="fas fa-shield-alt"></i> Legitimate indicators</h3>
            <ul id="negativeList" class="feature-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('emailForm');
      const analyzeBtn = document.getElementById('analyzeBtn');
      const alertBox = document.getElementById('alert');
      const resultCard = document.getElementById('resultCard');
      const resultLabel = document.getElementById('resultLabel');
      const confidenceBadge = document.getElementById('confidenceBadge');
      const confidenceFill = document.getElementById('confidenceFill');
      const explanationPanel = document.getElementById('explanation');
      const positiveList = document.getElementById('positiveList');
      const negativeList = document.getElementById('negativeList');

      function showAlert(message, type = 'error') {
        alertBox.textContent = message;
        alertBox.className = `message ${type}`;
      }

      function hideAlert() {
        alertBox.className = 'message hidden';
      }

      function showResult(data) {
        resultLabel.textContent = data.prediction.charAt(0).toUpperCase() + data.prediction.slice(1);
        confidenceBadge.textContent = `${data.confidence.toFixed(2)}%`;
        confidenceFill.style.width = `${Math.min(Math.max(data.confidence, 0), 100)}%`;
        resultCard.classList.add('active');
      }

      function showExplanation(explanation) {
        positiveList.innerHTML = explanation.positive.map(item => `
          <li>
            <span class="feature-name">${item.feature}</span>
            <span class="feature-score positive-score">${item.score.toFixed(3)}</span>
          </li>
        `).join('');

        negativeList.innerHTML = explanation.negative.map(item => `
          <li>
            <span class="feature-name">${item.feature}</span>
            <span class="feature-score negative-score">${item.score.toFixed(3)}</span>
          </li>
        `).join('');

        explanationPanel.classList.remove('hidden');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideAlert();
        resultCard.classList.remove('active');
        explanationPanel.classList.add('hidden');

        const emailText = document.getElementById('email_text').value.trim();
        if (!emailText) {
          showAlert('Please paste the email content before analyzing.');
          return;
        }

        analyzeBtn.disabled = true;
        analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';

        try {
          const response = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email_text: emailText }),
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || 'Analysis failed.');
          }

          showResult(payload);
          showExplanation(payload.explanation);
        } catch (error) {
          showAlert(error.message || 'Unable to analyze the email.');
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.innerHTML = '<i class="fas fa-search"></i> Analyze Email';
        }
      });
    </script>
  </body>
</html>
